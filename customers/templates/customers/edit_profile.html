<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile</title>
</head>

<body>

    <h1>Edit Profile</h1>

    <hr>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Profile
        </button>

    </form>

    <hr>

    <p>
        <a href="{% url 'customer_profile' %}">
            ← Back to Profile
        </a>
    </p>

</body>

</html>
