<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>
</head>

<body>

    <h1>Verify OTP</h1>

    <p>
        We have sent an OTP to your email or phone.
    </p>

    <p>
        For testing, use:
        <strong>123456</strong>
    </p>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <p>
            <label for="otp">
                Enter OTP:
            </label>
        </p>

        <p>
            <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                placeholder="Enter 6 digit OTP"
                required
            >
        </p>

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <hr>

    <p>
        <a href="{% url 'customer_login' %}">
            ← Back to Login
        </a>
    </p>

</body>

</html>
